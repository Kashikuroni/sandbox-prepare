[workspace]
members = ["crates/*"]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
aws-config = "1.13.1"
aws-sdk-s3 = "1.158.0"
gpui = "0.2.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

unicode-segmentation = "1"
serde_json = "1"
chrono = "0.4"

sha2 = "0.10.9"
crc32fast = "1.5"
zstd = "0.13.3"
tar = "0.4.44"
sandbox_core = { path = "crates/core" }
sandbox_platform = { path = "crates/platform" }
sandbox_telemetry = { path = "crates/telemetry" }
sandbox_ui = { path = "crates/ui" }
sandbox_settings = { path = "crates/settings" }
sandbox_backups = { path = "crates/backups" }
sandbox_sandboxes = { path = "crates/sandboxes" }
sandbox_workspace = { path = "crates/workspace" }
sandbox_runtime = { path = "crates/runtime" }
sandbox_projects = { path = "crates/projects" }
dotenvy = "0.15.7"
libc = "0.2"
